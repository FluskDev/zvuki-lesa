<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Тёмный фон -->
  <rect width="120" height="120" rx="24" fill="#141414"/>

  <!-- Горная вершина на заднем плане (силуэт) -->
  <polygon points="18,90 60,38 102,90" fill="#1a3a2a"/>

  <!-- Сосна / ёлка (изумрудная) -->
  <!-- Ствол -->
  <rect x="56" y="84" width="8" height="14" rx="2" fill="#10b981"/>
  <!-- Нижняя ступень -->
  <polygon points="60,56 28,84 92,84" fill="#10b981"/>
  <!-- Верхняя ступень -->
  <polygon points="60,30 34,56 86,56" fill="#10b981"/>
  <!-- Макушка -->
  <polygon points="60,14 40,32 80,32" fill="#10b981"/>
</svg>
